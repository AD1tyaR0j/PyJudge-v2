# PyJudge configuration.
# Every key can be overridden without editing this file:
#   JVM system property  -Dpyjudge.db.url=...
#   environment variable  PYJUDGE_DB_URL=...

# --- Database (JDBC) -------------------------------------------------------
# Embedded H2 (MySQL mode) for zero-setup local running; switch to MySQL for production:
db.url=jdbc:h2:file:~/pyjudge-data/pyjudge;MODE=MySQL;DATABASE_TO_LOWER=TRUE
db.user=sa
db.password=
# Connections kept in the pool
db.pool.size=8

# --- Running student code --------------------------------------------------
# process = local Python process (development); docker = one container per run (production)
sandbox.backend=process
sandbox.docker.image=python:3.11-slim
# Leave empty to auto-detect python3 / python on the PATH
python.executable=
# Threads that judge submissions in the background
judge.workers=4
# true = judge inside the request thread (used by the tests)
judge.sync=false

# --- First start -----------------------------------------------------------
# Load the 37 starter exercises, the Python course and a sample challenge when the tables are empty
seed.onStartup=true
# Created only when there is no admin yet. Change the password after the first login.
bootstrap.admin.username=admin
bootstrap.admin.email=admin@pyjudge.local
bootstrap.admin.password=admin12345
# Demo instructor/student accounts (instructor / instructor12345, student / student12345), created with the admin
bootstrap.demoAccounts=true
